  <!-- Clasp -->
  <rect x="27.5" y="34.5" width="9" height="5" rx="2.5" fill="url(#bg)"/>
  <!-- Small sparkle top-right -->
  <circle cx="52" cy="12" r="3" fill="white" opacity="0.6"/>
  <circle cx="58" cy="8" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="55" cy="18" r="1" fill="white" opacity="0.3"/>
